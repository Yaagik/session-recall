schema_version: "1.1"
name: rerun-no-new
tags: [core]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill to document this project's AI session history.
    Arguments: --home ./fixture-home --all
    I approve the token estimate.
context:
  scaffold_script: scaffold.sh
graders:
  - name: says-no-new
    type: regex
    pattern: 'no new sessions'
    flags: i
  - name: no-runlog
    type: file_exists
    path: docs/ai-history/sessions/*.md
    exists: false
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: covered-titles-not-read
    type: regex
    target: trace
    pattern: 'UNIQUE-TITLE-[AB]-covered'
    match: not_contains
