schema_version: "1.1"
name: codex
tags: [tools]
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill to document this project's AI session history.
    Arguments: --home ./fixture-home --all
    I accept the privacy notice and approve the token estimate.
context:
  scaffold_script: scaffold.sh
graders:
  - name: codex-covered
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'codex:019a0000-0000-7000-8000-00000000c0de'
  - name: codex-runlog-section
    type: tool_used
    tool: Write
    input_match: '(?=[\s\S]*docs/ai-history/sessions/)(?=[\s\S]*## Codex CLI · )'
    min: 1
  - name: injected-context-skipped
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'environment_context'
    match: not_contains
