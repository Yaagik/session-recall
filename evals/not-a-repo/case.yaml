schema_version: "1.1"
name: not-a-repo
tags: [paths]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill to document this folder's AI session history.
    Arguments: --home ./fixture-home --all
    I accept the privacy notice and approve the token estimate.
context:
  scaffold_script: scaffold.sh
graders:
  - name: still-documents
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'claude-code:11111111-aaaa-4aaa-8aaa-000000000001'
  - name: warns-about-worktrees
    type: regex
    pattern: 'worktree'
    flags: i
