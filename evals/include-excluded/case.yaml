schema_version: "1.1"
name: include-excluded
tags: [selection]
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill on this project.
    Arguments: --home ./fixture-home --all --include claude-code:11111111-aaaa-4aaa-8aaa-000000000003
    I approve the token estimate.
context:
  scaffold_script: scaffold.sh
graders:
  - name: c-in-runlog
    type: tool_used
    tool: Write
    input_match: '(?=[\s\S]*docs/ai-history/sessions/)(?=[\s\S]*claude-code:11111111-aaaa-4aaa-8aaa-000000000003)'
    min: 1
  - name: c-now-covered
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: '\| claude-code:11111111-aaaa-4aaa-8aaa-000000000003 \|'
  - name: c-removed-from-excluded
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: '## Excluded sessions[\s\S]*claude-code:11111111-aaaa-4aaa-8aaa-000000000003'
    match: not_contains
