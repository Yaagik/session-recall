schema_version: "1.1"
name: same-day-rerun
tags: [core]
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill to document this project's AI session history.
    Arguments: --home ./fixture-home --all
    I approve the token estimate.
context:
  scaffold_script: scaffold.sh
graders:
  - name: numbered-runlog
    type: file_exists
    path: docs/ai-history/sessions/*-2.md
    exists: true
  - name: b-documented
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'claude-code:11111111-aaaa-4aaa-8aaa-000000000002'
  - name: ghost-row-kept
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'claude-code:99999999-ghost-0000-0000-000000000000'
  - name: a-not-redocumented
    type: tool_used
    tool: Write
    input_match: '(?=[\s\S]*docs/ai-history/sessions/)(?=[\s\S]*000000000001)'
    min: 0
    max: 0
    arm: both
