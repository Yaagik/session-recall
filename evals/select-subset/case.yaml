schema_version: "1.1"
name: select-subset
tags: [selection]
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill to document this project's AI session history.
    Arguments: --home ./fixture-home
    I accept the privacy notice and approve the token estimate. When you list the sessions, document only the
    "Fix login redirect bug" and "Add Stripe webhook handler" sessions.
    Exclude every other session permanently - yes, I confirm the exclusion.
context:
  scaffold_script: scaffold.sh
graders:
  - name: a-documented
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: '\| claude-code:11111111-aaaa-4aaa-8aaa-000000000001 \|'
  - name: b-documented
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: '\| claude-code:11111111-aaaa-4aaa-8aaa-000000000002 \|'
  - name: c-excluded-by-id
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: '## Excluded sessions[\s\S]*claude-code:11111111-aaaa-4aaa-8aaa-000000000003'
  - name: c-content-not-in-history
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'zebra-quokka|private notes'
    flags: i
    match: not_contains
  - name: c-content-never-written
    type: tool_used
    tool: Write
    input_match: 'zebra-quokka|[Pp]rivate notes'
    min: 0
    max: 0
    arm: both
  - name: c-not-in-runlog
    type: tool_used
    tool: Write
    input_match: '(?=[\s\S]*docs/ai-history/sessions/)(?=[\s\S]*000000000003)'
    min: 0
    max: 0
    arm: both
