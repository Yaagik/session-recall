schema_version: "1.1"
name: select-none
tags: [selection]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill on this project.
    Arguments: --home ./fixture-home
    I accept the privacy notice. When you list the sessions, my answer is: none.
    Yes, exclude them all permanently.
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-estimate-for-zero-sessions
    type: regex
    pattern: 'Estimated token use'
    match: not_contains
  - name: no-runlog
    type: file_exists
    path: docs/ai-history/sessions/*.md
    exists: false
  - name: all-three-excluded
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: '## Excluded sessions[\s\S]*000000000001[\s\S]*000000000002[\s\S]*000000000003|## Excluded sessions[\s\S]*000000000003[\s\S]*000000000002[\s\S]*000000000001'
  - name: no-titles-of-excluded
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'Fix login redirect bug|Add Stripe webhook handler|private notes'
    match: not_contains
