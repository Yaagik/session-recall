schema_version: "1.1"
name: privacy-first-run
tags: [privacy]
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill to document this project's AI session history.
    Arguments: --home ./fixture-home --all
context:
  scaffold_script: scaffold.sh
graders:
  - name: asks-about-provider
    type: regex
    pattern: 'model provider'
    flags: i
  - name: nothing-written-before-consent
    type: file_exists
    path: 'docs/ai-history/**'
    exists: false
