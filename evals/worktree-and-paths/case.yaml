schema_version: "1.1"
name: worktree-and-paths
tags: [paths]
execution:
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill to document this project's AI session history.
    Arguments: --home ./fixture-home --all
    I accept the privacy notice and approve the token estimate.
    If you find possible sessions from deleted worktrees, list them in your reply but do not document them.
context:
  scaffold_script: scaffold.sh
graders:
  - name: logical-path-session
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'claude-code:11111111-aaaa-4aaa-8aaa-000000000001'
  - name: worktree-session
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'claude-code:11111111-aaaa-4aaa-8aaa-000000000006'
  - name: subfolder-session
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'claude-code:11111111-aaaa-4aaa-8aaa-000000000007'
  - name: long-path-session
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'claude-code:11111111-aaaa-4aaa-8aaa-00000000000b'
  - name: deleted-worktree-offered
    type: regex
    pattern: 'Work in a merged and deleted worktree|000000000009'
  - name: prefix-collision-excluded
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: '000000000008|Unrelated old project'
    match: not_contains
  - name: prefix-collision-never-written
    type: tool_used
    tool: Write
    input_match: '000000000008|Unrelated old project'
    min: 0
    max: 0
    arm: both
