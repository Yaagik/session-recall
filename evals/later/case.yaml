schema_version: "1.1"
name: later
tags: [selection]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill on this project.
    Arguments: --home ./fixture-home
    I accept the privacy notice and approve the token estimate. Just show me the list of sessions you found;
    my answer to "which should I document" is: later.
context:
  scaffold_script: scaffold.sh
graders:
  - name: nothing-written
    type: file_exists
    path: 'docs/ai-history/**'
    exists: false
  - name: listed-a
    type: regex
    pattern: 'Fix login redirect bug'
  - name: listed-c
    type: regex
    pattern: 'Experiment with private notes'
  - name: per-session-token-estimate
    type: regex
    pattern: 'Fix login redirect bug[^\n]*~[\d,]+'
