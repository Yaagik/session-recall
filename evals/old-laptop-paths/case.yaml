schema_version: "1.1"
name: old-laptop-paths
tags: [paths]
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill on this project, reading from a backup of my old laptop.
    Arguments: --home ./old-laptop-home --path /Users/olduser/code/demo-app --all
    I accept the privacy notice and approve the token estimate.
context:
  scaffold_script: scaffold.sh
graders:
  - name: old-path-session-documented
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'claude-code:11111111-aaaa-4aaa-8aaa-00000000000a'
