schema_version: "1.1"
name: cline-roo
tags: [tools]
execution:
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill to document this project's AI session history.
    Arguments: --home ./fixture-home --all
    I accept the privacy notice and approve the token estimate.
context:
  scaffold_script: scaffold.sh
graders:
  - name: cline-covered
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'cline:1727600000000'
  - name: roo-covered
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'roo-code:1727700000000'
  - name: other-project-excluded
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: '1727800000000|Unrelated cline task'
    match: not_contains
  - name: env-details-stripped
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'environment_details'
    match: not_contains
