schema_version: "1.1"
name: missing-and-malformed
tags: [robustness]
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Use the session-recall skill to document this project's AI session history.
    Arguments: --home ./fixture-home --all
    I accept the privacy notice and approve the token estimate.
context:
  scaffold_script: scaffold.sh
graders:
  - name: claude-still-documented
    type: regex
    target: { source: file, path: docs/ai-history/HISTORY.md }
    pattern: 'claude-code:11111111-aaaa-4aaa-8aaa-000000000001'
  - name: codex-format-mismatch-reported
    type: regex
    pattern: 'Skipped \(format looks different[^\n]*Codex'
  - name: gemini-not-found-reported
    type: regex
    pattern: 'Not found on this machine:[^\n]*Gemini CLI'
